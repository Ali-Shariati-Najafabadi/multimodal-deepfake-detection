experiment:
  name: "phase4_gated_fusion"
  phase: "phase4"
  description: "Phase 4: Fusion Strategy Comparison - Gated Fusion"
  tags:
    - "fusion_comparison"
    - "gated_fusion"
  seed: 42
  debug_mode: false
  resume_from_checkpoint: null


models:
  video:
    architecture: "x3d_m"
    pretrained: true
    freeze_backbone: true
    unfreeze_layers: ["blocks.4", "blocks.5"]
    dropout: 0.5
    num_frames: 16
    output_type: "video"
    num_classes: 2
  
  audio:
    architecture: "hubert"
    pretrained_model: "facebook/hubert-base-ls960"
    freeze_feature_extractor: false
    unfreeze_last_n_layers: 2
    dropout: 0.5
    pooling: "avg"
    output_type: "video"
    num_classes: 2
  
  fusion:
    type: "gated"
    hidden_dim: 512
    dropout: 0.5
  
  head:
    type: "classification"
    hidden_dims: [512, 256]
    dropout: 0.5
  
  num_classes: 2


datasets:
  av_deepfake:
    enabled: false
    path: "/data/shared/Datasets/AV-Deepfake1M-PlusPlus"
    weight: 1.0
    use_segment_labels: false
  
  deepspeak:
    enabled: true
    path: "/data/shared/Datasets/DeepspeakV2"
    weight: 1.0


preprocessing:
  video:
    face_detection:
      face_size: 224
      device: "cpu"
      min_face_size: 20
      confidence_threshold: 0.85
    extraction:
      sample_rate: 3
  
  audio:
    extraction:
      target_sr: 16000
    segmentation:
      segment_duration: 4.0
      overlap: 0.5
    normalize: true


data:
  video:
    max_frames: 32
    min_frames: 32
    frame_size: 224
    normalize: true
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  
  audio:
    max_duration: 16.0
    sample_rate: 16000
  
  augmentation:
    enabled: true
    random_horizontal_flip: 0.5
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.1
      hue: 0.05
      p: 0.5
    random_rotation: 10
    random_rotation_p: 0.3
    random_grayscale: 0.1
    gaussian_blur: 0.2
    jpeg_compression:
      enabled: true
      quality_lower: 70
      quality_upper: 100
      p: 0.3
    random_crop:
      enabled: true
      scale: [0.90, 1.0]
      p: 0.2


training:
  batch_size: 4
  num_epochs: 10
  num_workers: 20
  gradient_accumulation_steps: 16
  
  modality:
    video_enabled: true
    audio_enabled: true
  
  staged_training:
    enabled: false
  
  modality_dropout:
    enabled: false
  
  optimizer:
    video:
      type: "sgd"
      lr: 0.0005
      momentum: 0.9
      weight_decay: 0.0005
    audio:
      type: "adamw"
      lr: 0.00005
      weight_decay: 0.1
    fusion:
      type: "adamw"
      lr: 0.0003
      weight_decay: 0.05
  
  scheduler:
    video:
      type: "step"
      step_size: 3
      gamma: 0.3
    audio:
      type: "cosine_warmup"
      num_warmup_steps: 200
      num_training_steps: 1500
    fusion:
      type: "cosine_warmup"
      num_warmup_steps: 200
      num_training_steps: 1500
  
  loss:
    classification:
      type: "focal"
      focal:
        gamma: 2.0
        alpha: 0.25
      label_smoothing: 0.1
    auxiliary:
      enabled: true
      fusion_weight: 0.5
      video_weight: 0.25
      audio_weight: 0.25
  
  gradient_clip: 1.0
  use_amp: true
  device: "cuda"


segment_level:
  enabled: false


evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "auc"
    - "uar"
  eval_every_n_epochs: 1
  save_best_metric: "uar"
  save_best_mode: "max"


logging:
  use_tensorboard: true
  tensorboard_dir: "/data/shared/ali/deepfake-detection/logs/tensorboard/phase4_gated"
  use_wandb: false
  log_every_n_steps: 50


checkpointing:
  save_dir: "/data/shared/ali/deepfake-detection/checkpoints/phase4_gated"
  save_every_n_epochs: 1
  keep_last_n: 5
  save_best_fusion: true


system:
  cudnn_benchmark: true
  cudnn_deterministic: false
  pin_memory: true
  empty_cache_every_n_steps: 100
