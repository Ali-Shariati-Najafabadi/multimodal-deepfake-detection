experiment:
  name: "phase3_timesformer_cross_attention_fixed"
  phase: "phase3"
  description: "Phase 3: TimeSformer + HuBERT + Cross-Attention"
  tags:
    - "timesformer"
    - "cross_attention"
    - "multimodal"
  seed: 42
  debug_mode: true
  debug_samples: 20000
  resume_from_checkpoint: null

models:
  video:
    architecture: "timesformer_base"
    pretrained: true
    freeze_backbone: false
    unfreeze_layers: ["6", "7", "8", "9", "10", "11"]
    dropout: 0.1
    num_frames: 32
    output_type: "video"
    num_classes: 2
  
  audio:
    architecture: "hubert"
    pretrained_model: "facebook/hubert-base-ls960"
    freeze_feature_extractor: false
    unfreeze_last_n_layers: 4
    dropout: 0.1
    pooling: "avg"
    output_type: "video"
    num_classes: 2
  
  fusion:
    type: "cross_attention"
    hidden_dim: 512
    dropout: 0.2
    cross_attention:
      num_heads: 8
      num_layers: 2
  
  head:
    type: "classification"
    hidden_dims: [512, 256]
    dropout: 0.2
  
  num_classes: 2

datasets:
  av_deepfake:
    enabled: true
    path: "/data/shared/Datasets/AV-Deepfake1M-PlusPlus"
    weight: 1.0
    use_segment_labels: false
    fps: 25
    sample_rate: 16000
  
  deepspeak:
    enabled: false
    path: "/data/shared/Datasets/DeepspeakV2"
    weight: 1.0
    fps: 25
    sample_rate: 16000

preprocessing:
  video:
    face_detection:
      face_size: 224
      device: "cpu"
      min_face_size: 20
      confidence_threshold: 0.85
    extraction:
      sample_rate: 3
  
  audio:
    extraction:
      target_sr: 16000
    segmentation:
      segment_duration: 4.0
      overlap: 0.5
    normalize: true

data:
  video:
    max_frames: 32
    min_frames: 32
    frame_size: 224
    normalize: true
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    use_random_crop: true              # true = random crop, false = sequential from start 
    random_crop_training_only: true   # true = only train, false = train+val
  
  audio:
    max_duration: 16.0
    sample_rate: 16000
    n_fft: 400
    hop_length: 160
    n_mels: 80
    use_temporal_alignment: false
    alignment_window: 8.0
  
  augmentation:
    enabled: true
    random_horizontal_flip: 0.5
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.15
      hue: 0.1
      p: 0.6
    random_rotation: 10
    random_rotation_p: 0.3
    random_grayscale: 0.15
    gaussian_blur: 0.2
    jpeg_compression:
      enabled: true
      quality_lower: 60
      quality_upper: 100
      p: 0.5
    random_crop:
      enabled: true
      scale: [0.9, 1.0]
      p: 0.2

training:
  batch_size: 8
  num_epochs: 30
  num_workers: 20
  gradient_accumulation_steps: 2
  
  modality:
    video_enabled: true
    audio_enabled: true
  
  staged_training:
    enabled: false
  
  modality_dropout:
    enabled: false
  
  optimizer:
    video:
      type: "adamw"
      lr: 0.0003
      weight_decay: 0.01
      betas: [0.9, 0.999]
    audio:
      type: "adamw"
      lr: 0.0003
      weight_decay: 0.001
      betas: [0.9, 0.999]
    fusion:
      type: "adamw"
      lr: 0.0003
      weight_decay: 0.01
      betas: [0.9, 0.999]
  
  scheduler:
    video:
      type: "cosine_warmup"
      num_warmup_steps: 100
      num_training_steps: 18750
    audio:
      type: "cosine_warmup"
      num_warmup_steps: 200
      num_training_steps: 18750
    fusion:
      type: "cosine_warmup"
      num_warmup_steps: 150
      num_training_steps: 18750
  
  loss:
    type: "cross_entropy"
    class_weights: "auto"
    label_smoothing: 0.05
    auxiliary:
      enabled: true
      alpha: 0.4
      beta: 0.35
      gamma: 0.25
  
  gradient_clip: 1.0
  use_amp: true
  device: "cuda"

segment_level:
  enabled: false

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "auc"
    - "uar"
  eval_every_n_epochs: 1
  save_best_metric: "uar"
  save_best_mode: "max"

logging:
  use_tensorboard: true
  tensorboard_dir: "/data/shared/ali/deepfake/logs/tensorboard/phase3_timesformer"
  use_wandb: false
  log_every_n_steps: 50

checkpointing:
  save_dir: "/data/shared/ali/deepfake/checkpoints/phase3_timesformer_avdeepfake"
  save_every_n_epochs: 1
  keep_last_n: 30
  save_best_fusion: true
  save_best_video: false
  save_best_audio: false

system:
  cudnn_benchmark: true
  cudnn_deterministic: false
  pin_memory: true
  empty_cache_every_n_steps: 50
